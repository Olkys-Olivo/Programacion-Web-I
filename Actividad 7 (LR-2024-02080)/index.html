<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartoons</title>
  </head>
  <body>
    <main class="main">
      <h1 class="banner">~ Cartoons List ~</h1>
      <section class="insert">
        <form class="form">
          <input type="text" name="Titulo" placeholder="Inserta el Título" />
          <input type="number" name="Inicio" placeholder="Inserta el año de inicio" step="0.01" />
          <input type="number" name="Finalizo" placeholder="Inserta el año de finalización" step="0.01" />
          <input type="number" name="Temporadas" placeholder="Inserta el número de temporadas" step="0.01" />
          <input type="text" name="Pais_de_Origen" placeholder="Inserta el país de origen" />
          <input type="number" name="Episodios" placeholder="Inserta el número de episodios" step="0.01" />
          
          <div class="botones">
          <button type="submit">Registrar</button>
          <button type="button" class="clear-btn">Limpiar</button>
          </div>
        </form>
      </section>

      <section class="data">
        <button class="btn">Mostrar Caricaturas</button>

        <section class="data-table">
          <table class="table">
            <thead class="thead"></thead>
            <tbody class="tbody"></tbody>
          </table>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
